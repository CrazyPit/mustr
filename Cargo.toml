[package]
name = "mustr"
version = "0.1.0"
edition = "2021"
description = "Command center for coding-agent work — CLI"
license = "MIT"

[lib]
name = "mustr"
path = "src/lib.rs"

[[bin]]
name = "mustr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
